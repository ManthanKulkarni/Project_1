# ==============================
# Application Info
# ==============================
spring.application.name=placement-management-system
server.port=8080

# ==============================
# MySQL Datasource
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/placement_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==============================
# Jackson
# ==============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================
# Logging
# ==============================
logging.level.org.springframework=INFO
logging.level.com.placement.pms=DEBUG
